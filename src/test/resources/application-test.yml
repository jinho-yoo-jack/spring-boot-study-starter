spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

# JWT settings for test
jwt:
  secret: test-secret-key-for-jwt-token-generation-must-be-at-least-256-bits
  access-token-validity: 3600000  # 1 hour
  refresh-token-validity: 604800000  # 7 days

# Logging
logging:
  level:
    com.study.myspringstudydiary: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
